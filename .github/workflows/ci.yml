name: CI

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test hygiene gate (no Mocha-isms, no focused tests)
        run: npm run lint:tests

      - name: Build
        run: npm run build

      - name: Sync advisory database (required by e2e tests using --offline)
        run: node dist/index.js advisories sync

      - name: Test
        run: npm test
